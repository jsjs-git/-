<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>약속 메이커</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f7fb; --card:#fff; --ink:#1d2433; --sub:#6b7385; --line:#e4e7ef;
    --blue:#2f6bff; --blue-soft:#eaf0ff; --red:#ff5a5f; --red-soft:#ffecec;
    --amber:#f5a524; --amber-soft:#fff5e1; --off:#f0f1f5;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:720px;margin:0 auto;padding:20px 14px 60px}
  header h1{font-size:24px;font-weight:900;margin:0 0 2px;letter-spacing:-.5px}
  header p{margin:0 0 16px;color:var(--sub);font-size:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
  .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  .field{display:flex;flex-direction:column;gap:4px;flex:1;min-width:120px}
  .field label{font-size:12px;color:var(--sub);font-weight:500}
  select,input[type=text]{font:inherit;font-size:15px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);width:100%}
  .seg{display:flex;background:var(--off);border-radius:12px;padding:3px;gap:3px}
  .seg button{flex:1;border:0;background:transparent;font:inherit;font-size:14px;font-weight:500;padding:8px 6px;border-radius:9px;color:var(--sub);cursor:pointer}
  .seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08);font-weight:700}
  .bar{display:flex;flex-direction:column;gap:10px}
  .bar-row{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .month-nav,.stepper{display:flex;align-items:center;background:var(--off);border-radius:12px;padding:3px}
  .month-nav button,.stepper button{width:34px;height:34px;border:0;border-radius:9px;background:#fff;font-size:18px;font-weight:700;color:var(--ink);cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.06)}
  .stepper button:disabled{opacity:.35;cursor:default}
  #monthLabel{min-width:92px;text-align:center;font-weight:900;font-size:16px}
  #countLabel{min-width:62px;text-align:center;font-weight:700;font-size:15px}
  .section-title{font-size:13px;font-weight:700;color:var(--sub);margin:0 0 8px}
  .ppl{padding:10px 12px}
  .people{display:flex;flex-wrap:wrap;gap:6px}
  .person{display:flex;align-items:center;gap:5px;border:1.5px solid var(--line);border-radius:999px;padding:4px 10px 4px 4px;cursor:pointer;background:#fff;font-size:13px;font-weight:500;transition:.15s;line-height:1}
  .person .dot{width:20px;height:20px;border-radius:50%;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
  .person .ok{font-size:11px;color:#12b886;font-weight:900}
  .person.ghost{border-style:dashed;color:var(--sub)}
  .person.me{color:#fff;border-color:transparent}
  .person.me .dot{background:rgba(255,255,255,.25)!important}
  .person.me .ok{color:#fff}
  .person .edit{border:0;background:rgba(255,255,255,.25);color:#fff;border-radius:999px;width:20px;height:20px;font-size:11px;cursor:pointer;padding:0;margin-left:2px}
  .person input{border:0;outline:0;background:transparent;color:#fff;font:inherit;font-size:13px;width:80px;padding:0}
  .person input::placeholder{color:rgba(255,255,255,.7)}
  .hint{font-size:12px;color:var(--sub)}
  .hint-row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:7px}
  .btns{display:flex;gap:5px;flex-shrink:0}
  #manageBtn.on{background:var(--red);color:#fff}
  .person .del{border:0;background:var(--red);color:#fff;border-radius:999px;width:20px;height:20px;font-size:11px;font-weight:900;cursor:pointer;padding:0;margin-left:2px}
  .hint .reset{border:0;background:var(--red);color:#fff;font:inherit;font-size:11px;font-weight:700;padding:3px 8px;border-radius:7px;cursor:pointer}
  .person.managing{border-color:var(--red)}
  #manageBtn,#linkBtn{border:0;background:var(--off);color:var(--ink);font:inherit;font-size:12px;font-weight:700;padding:5px 9px;border-radius:8px;cursor:pointer;white-space:nowrap}
  .links{display:none;margin-top:8px;border-top:1px solid var(--line);padding-top:8px;flex-direction:column;gap:5px}
  .links.show{display:flex}
  .links .lk{display:flex;align-items:center;gap:6px;font-size:12px}
  .links .lk b{min-width:44px}
  .links .lk input{flex:1;min-width:0;font:inherit;font-size:11px;color:var(--sub);border:1px solid var(--line);border-radius:7px;padding:5px 6px;background:var(--bg)}
  .links button{border:0;background:var(--blue);color:#fff;font:inherit;font-size:11px;font-weight:700;padding:5px 8px;border-radius:7px;cursor:pointer;white-space:nowrap}
  .links .all{align-self:flex-end;background:var(--ink)}
  .hint b{color:var(--red)}
  .cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .cal-head h2{margin:0;font-size:18px;font-weight:900}
  .cal-head .nav button{border:1px solid var(--line);background:#fff;border-radius:8px;width:34px;height:34px;font-size:16px;cursor:pointer}
  .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
  .dow{text-align:center;font-size:12px;font-weight:700;color:var(--sub);padding:4px 0}
  .dow.sun{color:var(--red)} .dow.sat{color:var(--blue)}
  .day{position:relative;min-height:72px;border:1.5px solid var(--line);border-radius:12px;padding:5px;background:#fff;cursor:pointer;display:flex;flex-direction:column;gap:3px;transition:.12s;user-select:none}
  .day:active{transform:scale(.97)}
  .day .n{font-size:14px;font-weight:700}
  .day.sun .n{color:var(--red)} .day.sat .n{color:var(--blue)}
  .day.blank{border:0;background:transparent;cursor:default}
  .day.off{background:var(--off);border-color:transparent;cursor:default;opacity:.45}
  .day.mine{background:var(--red-soft);border-color:var(--red)}
  .day.mine::after{content:"✕";position:absolute;top:4px;right:6px;color:var(--red);font-weight:900;font-size:13px}
  .day .marks{display:flex;flex-wrap:wrap;gap:2px}
  .day .marks span{width:8px;height:8px;border-radius:50%}
  .day.best{border:3px solid var(--blue);background:var(--blue-soft);box-shadow:0 0 0 3px rgba(47,107,255,.15)}
  .day.best .tag{background:var(--blue)}
  .day.second{border:2.5px dashed var(--amber);background:var(--amber-soft)}
  .day.second .tag{background:var(--amber)}
  .day .tag{margin-top:auto;align-self:flex-start;color:#fff;font-size:10px;font-weight:700;border-radius:6px;padding:1px 5px;white-space:nowrap}
  .day.best.mine,.day.second.mine{background:var(--red-soft)}
  .legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--sub);margin-top:10px}
  .legend i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-2px;margin-right:4px}
  .result h3{margin:0 0 8px;font-size:17px;font-weight:900}
  .result ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
  .result li{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border-radius:10px;background:var(--blue-soft);font-size:15px;font-weight:500}
  .result li.alt{background:var(--amber-soft)}
  .result li small{color:var(--sub);font-weight:400}
  .result .empty{color:var(--sub);font-size:14px}
  .status{font-size:12px;color:var(--sub);text-align:center;margin-top:14px}
  .status.warn{color:#b26b00}
  .progress{font-size:13px;color:var(--sub);margin-bottom:8px}
  @media (max-width:420px){ .day{min-height:62px;padding:4px} .day .n{font-size:13px} .day .tag{font-size:9px;padding:1px 3px} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>📅 약속 메이커</h1>
    <p><b style="color:var(--red)">안 되는 날</b>만 눌러주세요. 모두 되는 날을 찾아드려요.</p>
  </header>

  <div class="card bar">
    <div class="bar-row">
      <div class="month-nav">
        <button id="prev" aria-label="이전 달">‹</button>
        <span id="monthLabel"></span>
        <button id="next" aria-label="다음 달">›</button>
      </div>
      <div class="stepper">
        <button id="minus" aria-label="인원 줄이기">−</button>
        <span id="countLabel"></span>
        <button id="plus" aria-label="인원 늘리기">+</button>
      </div>
    </div>
    <div class="seg" id="mode">
      <button data-m="weekday">평일</button>
      <button data-m="weekend">금토일</button>
      <button data-m="all">전체</button>
    </div>
  </div>

  <div class="card ppl">
    <div class="people" id="people"></div>
    <div class="hint-row"><div class="hint" id="hint"></div><div class="btns"><button id="manageBtn">🗑 삭제</button><button id="linkBtn">🔗 링크 복사</button></div></div>
  </div>

  <div class="card">
    <div class="cal-head">
      <h2 id="calTitle"></h2>
    </div>
    <div class="grid" id="grid"></div>
    <div class="legend">
      <span><i style="background:var(--blue-soft);border:2px solid var(--blue)"></i>⭐ 최고의 날 (모두 가능)</span>
      <span><i style="background:var(--amber-soft);border:2px dashed var(--amber)"></i>차선 (안 되는 사람 최소)</span>
      <span><i style="background:var(--red-soft);border:2px solid var(--red)"></i>내가 안 되는 날</span>
    </div>
  </div>

  <div class="card result" id="result"></div>
  <div class="status" id="status">불러오는 중…</div>
</div>

<script>
/* ================== 설정: 여기에 Firebase Realtime Database 주소를 붙여넣으세요 ==================
   예) const DB_URL = "https://yaksok-abc12-default-rtdb.asia-southeast1.firebasedatabase.app";
   비워두면 이 기기에서만 저장되는 '혼자 모드'로 동작합니다. */
const DB_URL = "https://yaksok-45414-default-rtdb.asia-southeast1.firebasedatabase.app";
/* ============================================================================================ */

// 같은 사이트로 여러 약속을 따로 쓰고 싶으면 주소 끝에 #모임이름 을 붙이세요 (예: .../#신년회)
const ROOM = (()=>{ let h=location.hash.slice(1); try{ h=decodeURIComponent(h); }catch(e){} return h.replace(/[.#$\[\]\/\s]/g,"").slice(0,40) || "main"; })();

// 이 브라우저의 익명 ID (처음 접속 때 만들어 저장 → 같은 링크로 들어와도 사람마다 구분)
const newId=()=>"u"+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const ME = (()=>{ try{ let d=localStorage.getItem("ym_dev"); if(!d){ d=newId(); localStorage.setItem("ym_dev",d); } return d; }catch(e){ return newId(); } })();

const COLORS=["#ff5a5f","#2f6bff","#12b886","#f5a524","#9b59ff","#ff7ac6","#0ab3c9","#7a8b00","#e8590c","#495057","#c2255c","#5c7cfa"];
const DOW=["일","월","화","수","목","금","토"];
const today=new Date(); today.setHours(0,0,0,0);

let settings={count:4,year:2026,month:12,mode:"weekend"};
let people={};          // 익명ID -> {name, dates:[], touched:[], joined}
let online=false;
const pending={};
let editing=false;

const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,"0");
const key=(y,m,d)=>`${y}-${pad(m)}-${pad(d)}`;
const ym=()=>`${settings.year}-${pad(settings.month)}`;

/* ---------- 사람 ---------- */
function order(){ return Object.keys(people).filter(id=>people[id]&&people[id].joined).sort((a,b)=>(people[a].joined-people[b].joined)||(a<b?-1:1)); }
function isJoined(){ return !!(people[ME]&&people[ME].joined); }
function slot(id){ const o=order(), i=o.indexOf(id); return i<0?o.length:i; }   // 미참여면 다음 번호
function colorOf(id){ return COLORS[slot(id)%COLORS.length]; }
function nameOf(id){ const p=people[id]; return (p&&p.name)||`${slot(id)+1}번`; }
const datesOf=id=>(people[id]&&people[id].dates)||[];
function ensureMe(){ if(!isJoined()) people[ME]={name:"",dates:[],touched:[],...(people[ME]||{}),joined:Date.now()}; }

function inMode(dow){
  if(settings.mode==="weekend") return dow===5||dow===6||dow===0;
  if(settings.mode==="weekday") return dow>=1&&dow<=4;
  return true;
}

/* ---------- 상단 옵션 ---------- */
function buildControls(){
  $("monthLabel").textContent=`${settings.year}. ${settings.month}월`;
  $("countLabel").textContent=`👥 ${settings.count}명`;
  $("minus").disabled=settings.count<=2;
  $("plus").disabled=settings.count>=30;
  document.querySelectorAll("#mode button").forEach(b=>b.classList.toggle("on",b.dataset.m===settings.mode));
}
$("minus").onclick=()=>updateSettings({count:Math.max(2,settings.count-1)});
$("plus").onclick=()=>updateSettings({count:Math.min(30,settings.count+1)});
document.querySelectorAll("#mode button").forEach(b=>b.onclick=()=>updateSettings({mode:b.dataset.m}));
$("prev").onclick=()=>shiftMonth(-1);
$("next").onclick=()=>shiftMonth(1);
function shiftMonth(d){
  let y=settings.year,m=settings.month+d;
  if(m<1){m=12;y--;} if(m>12){m=1;y++;}
  updateSettings({year:y,month:m});
}
function updateSettings(patch){
  settings={...settings,...patch};
  render();
  if(online) put("settings",settings).catch(()=>showStatus("설정 저장 실패: Firebase 규칙(rules)을 확인해주세요",true));
  else saveLocal();
}

/* ---------- 참여자 칩 ---------- */
function chip(id,cls){
  const el=document.createElement("div");
  el.className="person"+cls;
  const c=colorOf(id);
  if(id===ME&&isJoined()) el.style.background=c;
  const dot=document.createElement("span"); dot.className="dot"; dot.style.background=c;
  dot.textContent=nameOf(id).slice(0,1);
  const nm=document.createElement("span"); nm.textContent=nameOf(id)+(id===ME?" (나)":"");
  el.append(dot,nm);
  return el;
}
let managing=false;
$("manageBtn").onclick=()=>{ managing=!managing; render(); };
function removePerson(id){
  const name=nameOf(id)+(id===ME?" (나)":"");
  if(!window.confirm(`${name}을(를) 삭제할까요?\n입력한 안 되는 날도 모두 지워져요.`)) return;
  if(pending[id]){ clearTimeout(pending[id]); delete pending[id]; }
  delete people[id];
  if(!order().length) managing=false;
  render();
  if(online) fetch(`${BASE}/people/${id}.json`,{method:"DELETE"})
    .then(r=>{ if(!r.ok) throw 0; showStatus("🗑 삭제됨"); })
    .catch(()=>showStatus("삭제 실패: 인터넷 연결이나 Firebase 규칙을 확인해주세요",true));
  else saveLocal();
}
function resetAll(){
  if(!window.confirm(`참여자 ${order().length}명과 입력한 날짜를 모두 지울까요?\n되돌릴 수 없어요.`)) return;
  Object.keys(pending).forEach(k=>{ clearTimeout(pending[k]); delete pending[k]; });
  people={}; managing=false; render();
  if(online) fetch(`${BASE}/people.json`,{method:"DELETE"})
    .then(r=>{ if(!r.ok) throw 0; showStatus("🧹 전체 초기화됐어요"); })
    .catch(()=>showStatus("초기화 실패: 인터넷 연결이나 Firebase 규칙을 확인해주세요",true));
  else saveLocal();
}
function renderPeople(){
  if(editing) return;
  const box=$("people"); box.innerHTML="";
  order().forEach(id=>{
    const el=chip(id,(id===ME?" me":"")+(managing?" managing":""));
    if(managing){
      const del=document.createElement("button"); del.className="del"; del.textContent="✕"; del.title="삭제";
      del.onclick=e=>{ e.stopPropagation(); removePerson(id); };
      el.appendChild(del);
    } else if(id===ME){
      const ed=document.createElement("button"); ed.className="edit"; ed.textContent="✏️"; ed.title="이름 바꾸기";
      ed.onclick=e=>{ e.stopPropagation(); startEdit(el); };
      el.appendChild(ed);
    }
    box.appendChild(el);
  });
  if(!isJoined()) box.appendChild(chip(ME," ghost"));
  $("manageBtn").textContent=managing?"완료":"🗑 삭제";
  $("manageBtn").classList.toggle("on",managing);
  $("manageBtn").style.display=(order().length||managing)?"":"none";
  if(managing){
    $("hint").innerHTML=order().length?"<b>✕</b> 한 명씩 삭제 · ":"참여자가 없어요";
    if(order().length){ const r=document.createElement("button"); r.className="reset"; r.textContent="전체 초기화"; r.onclick=resetAll; $("hint").appendChild(r); }
    return;
  }
  $("hint").innerHTML=isJoined()
    ? `나는 <b style="color:${colorOf(ME)}">${esc(nameOf(ME))}</b> · 안 되는 날을 눌러 ✕ · ✏️ 이름`
    : `들어온 순서대로 번호가 자동 배정돼요 · <b>안 되는 날</b>을 누르면 참여!`;
}
function startEdit(el){
  editing=true;
  el.innerHTML="";
  const dot=document.createElement("span"); dot.className="dot"; dot.textContent="✏️";
  const inp=document.createElement("input"); inp.maxLength=12; inp.placeholder="내 이름";
  inp.value=(people[ME]&&people[ME].name)||"";
  el.append(dot,inp); inp.focus(); inp.select();
  let done=false;
  const finish=save=>{ if(done) return; done=true; editing=false;
    if(save){ ensureMe(); people[ME]={...people[ME],name:inp.value.trim()}; persistMe(); }
    render(); };
  inp.onkeydown=e=>{ if(e.key==="Enter") finish(true); if(e.key==="Escape") finish(false); };
  inp.onblur=()=>finish(true);
}
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

$("linkBtn").onclick=()=>{
  const url=location.origin+location.pathname+(location.hash||"");
  const t=`📅 약속 날짜 정하기! 들어가서 안 되는 날만 눌러줘 👉 ${url}`;
  const b=$("linkBtn"), o=b.textContent;
  const ok=()=>{ b.textContent="✓ 복사됨"; setTimeout(()=>b.textContent=o,1500); };
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(ok,()=>showStatus("복사가 막혔어요. 주소창의 링크를 직접 복사해주세요",true));
  else showStatus("주소창의 링크를 직접 복사해주세요",true);
};

/* ---------- 달력 ---------- */
function toggleDay(k){
  ensureMe();
  const p=people[ME];
  const set=new Set(p.dates||[]);
  set.has(k)?set.delete(k):set.add(k);
  const touched=new Set(p.touched||[]); touched.add(k.slice(0,7));
  people[ME]={...p,dates:[...set].sort(),touched:[...touched]};
  render(); persistMe();
}
function persistMe(){
  if(!online){ saveLocal(); return; }
  clearTimeout(pending[ME]);
  pending[ME]=setTimeout(()=>{
    const p=people[ME]||{};
    put("people/"+ME,{name:p.name||"",dates:p.dates||[],touched:p.touched||[],joined:p.joined||Date.now()})
      .then(()=>{ delete pending[ME]; showStatus("✓ 저장됨 · 모두에게 실시간 공유돼요"); })
      .catch(()=>{ delete pending[ME]; showStatus("저장 실패: 인터넷 연결이나 Firebase 규칙을 확인해주세요",true); });
  },350);
}

function analyze(){
  const {year:y,month:m}=settings, ids=order();
  const days=new Date(y,m,0).getDate();
  const list=[];
  for(let d=1;d<=days;d++){
    const dt=new Date(y,m-1,d), dow=dt.getDay();
    if(!inMode(dow)||dt<today) continue;
    const k=key(y,m,d);
    list.push({d,k,dow,out:ids.filter(id=>datesOf(id).includes(k))});
  }
  const best=list.filter(x=>x.out.length===0);
  let second=[];
  if(!best.length&&list.length){
    const min=Math.min(...list.map(x=>x.out.length));
    if(min<ids.length) second=list.filter(x=>x.out.length===min);
  }
  return {list,best,second};
}

function renderCalendar(){
  const {year:y,month:m}=settings;
  $("calTitle").textContent=`${y}년 ${m}월`;
  const g=$("grid"); g.innerHTML="";
  DOW.forEach((n,i)=>{ const h=document.createElement("div"); h.className="dow"+(i===0?" sun":i===6?" sat":""); h.textContent=n; g.appendChild(h); });
  const first=new Date(y,m-1,1).getDay(), days=new Date(y,m,0).getDate();
  for(let i=0;i<first;i++){ const b=document.createElement("div"); b.className="day blank"; g.appendChild(b); }
  const {best,second}=analyze();
  const bestSet=new Set(best.map(x=>x.k)), secSet=new Set(second.map(x=>x.k));
  const ids=order();
  for(let d=1;d<=days;d++){
    const dt=new Date(y,m-1,d), dow=dt.getDay(), k=key(y,m,d);
    const el=document.createElement("div");
    let cls="day"+(dow===0?" sun":dow===6?" sat":"");
    const active=inMode(dow)&&dt>=today;
    if(!active) cls+=" off";
    if(datesOf(ME).includes(k)) cls+=" mine";
    if(active&&bestSet.has(k)) cls+=" best";
    if(active&&secSet.has(k)) cls+=" second";
    el.className=cls;
    const n=document.createElement("div"); n.className="n"; n.textContent=d; el.appendChild(n);
    if(active){
      const marks=document.createElement("div"); marks.className="marks";
      const who=[];
      ids.forEach(id=>{ if(datesOf(id).includes(k)){ const s=document.createElement("span"); s.style.background=colorOf(id); marks.appendChild(s); who.push(nameOf(id)); } });
      el.appendChild(marks);
      el.title=who.length?"안 됨: "+who.join(", "):"모두 가능";
      if(bestSet.has(k)){ const t=document.createElement("div"); t.className="tag"; t.textContent="⭐ 최고!"; el.appendChild(t); }
      else if(secSet.has(k)){ const t=document.createElement("div"); t.className="tag"; t.textContent=`차선 -${who.length}`; el.appendChild(t); }
      el.onclick=()=>toggleDay(k);
    }
    g.appendChild(el);
  }
}

function renderResult(){
  const {best,second,list}=analyze();
  const n=order().length, target=Math.max(settings.count,n);
  const r=$("result"); r.innerHTML="";
  const prog=document.createElement("div"); prog.className="progress";
  prog.textContent=`참여 ${n} / ${target}명`+(n<target?` · ${target-n}명 더 들어와야 해요`:" · 모두 참여했어요 🎉");
  r.appendChild(prog);
  const h=document.createElement("h3"), ul=document.createElement("ul");
  const fmt=x=>`${settings.month}월 ${x.d}일 (${DOW[x.dow]})`;
  if(!list.length){
    h.textContent="선택한 범위에 남은 날짜가 없어요";
  } else if(!n){
    h.textContent="아직 아무도 참여하지 않았어요";
  } else if(best.length){
    h.textContent=`⭐ 최고의 날 ${best.length}일 — 참여자 모두 가능!`;
    best.forEach(x=>{ const li=document.createElement("li"); li.textContent=fmt(x); ul.appendChild(li); });
  } else if(second.length){
    h.textContent="모두 되는 날이 없어요 · 차선 추천";
    second.forEach(x=>{ const li=document.createElement("li"); li.className="alt";
      const a=document.createElement("span"); a.textContent=fmt(x);
      const s=document.createElement("small"); s.textContent="안 됨: "+x.out.map(nameOf).join(", ");
      li.append(a,s); ul.appendChild(li); });
  } else {
    h.textContent="모든 날짜에 전원이 안 돼요 😢";
  }
  r.append(h,ul);
}

function render(){ buildControls(); renderPeople(); renderCalendar(); renderResult(); }
function showStatus(t,warn){ const s=$("status"); s.textContent=t; s.className="status"+(warn?" warn":""); }

/* ---------- 저장 (혼자 모드) ---------- */
function saveLocal(){ try{ localStorage.setItem("ym_local2",JSON.stringify({settings,people})); }catch(e){} }
function loadLocal(){ try{ const d=JSON.parse(localStorage.getItem("ym_local2")||"null"); if(d){ settings={...settings,...d.settings}; people=d.people||{}; } }catch(e){} }

/* ---------- Firebase Realtime Database (REST + 실시간 스트림, 로그인 불필요) ---------- */
const BASE = DB_URL.replace(/\/+$/,"") + "/yaksok/" + ROOM;
let root = {};

function put(path,data){
  return fetch(`${BASE}/${path}.json`,{method:"PUT",body:JSON.stringify(data)})
    .then(r=>{ if(!r.ok) throw new Error(r.status); return r.json(); });
}
function setAt(obj,parts,val){
  if(!parts.length) return val;
  const o=(obj&&typeof obj==="object")?{...obj}:{};
  const [h,...rest]=parts;
  const v=setAt(o[h],rest,val);
  if(v===null||v===undefined) delete o[h]; else o[h]=v;
  return o;
}
function applyRoot(){
  if(root&&root.settings&&root.settings.year) settings={...settings,...root.settings};
  const next={}, ps=(root&&root.people)||{};
  Object.keys(ps).forEach(k=>{ const p=ps[k]||{}; next[k]={name:p.name||"",dates:Object.values(p.dates||{}),touched:Object.values(p.touched||{}),joined:p.joined||0}; });
  if(pending[ME]&&people[ME]) next[ME]=people[ME];   // 저장 대기 중인 내 변경 유지
  people=next; render();
}
function connect(){
  if(!DB_URL){ goLocal("⚠️ DB_URL이 비어 있어 이 기기에서만 저장돼요 (index.html 맨 위에 Firebase 주소를 넣어주세요)"); return; }
  let first=true;
  const timer=setTimeout(()=>{ if(first) showStatus("연결이 느려요… 잠시만요",true); },10000);
  let es;
  try{ es=new EventSource(`${BASE}.json`); }catch(e){ goLocal("⚠️ 실시간 연결을 지원하지 않는 브라우저예요"); return; }
  online=true;
  const onEvt=type=>e=>{
    let msg; try{ msg=JSON.parse(e.data); }catch(_){ return; }
    if(!msg) return;
    const parts=(msg.path||"/").split("/").filter(Boolean);
    if(type==="put") root=setAt(root,parts,msg.data);
    else Object.keys(msg.data||{}).forEach(k=>{ root=setAt(root,[...parts,...k.split("/").filter(Boolean)],msg.data[k]); });
    if(first){ first=false; clearTimeout(timer); }
    applyRoot();
    showStatus(`🔗 공유 모드${ROOM!=="main"?" ("+ROOM+")":""} · 모두의 선택이 실시간으로 반영돼요`);
  };
  es.addEventListener("put",onEvt("put"));
  es.addEventListener("patch",onEvt("patch"));
  es.addEventListener("cancel",()=>showStatus("읽기 권한이 없어요: Firebase 규칙(rules)을 확인해주세요",true));
  es.onerror=()=>{ if(first) showStatus("Firebase에 연결하지 못했어요: DB_URL 주소를 확인해주세요",true); else showStatus("연결이 끊겼어요, 다시 연결 중…",true); };
}
function goLocal(msg){ online=false; loadLocal(); render(); showStatus(msg||"⚠️ 이 기기에서만 저장돼요",true); }
window.addEventListener("hashchange",()=>location.reload());

render();
connect();

</script>
</body>
</html>
